name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # Deploys to your live channel when changes are pushed to the main branch
  pull_request:
    branches:
      - main # Creates a preview channel for each pull request

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install dependencies and build your project
      - run: npm ci
      - run: npm run build

      # STEP 1: Deploy to Firebase Hosting (Preview Channel for Pull Requests)
      - name: Deploy to Firebase Hosting (Preview Channel)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v1 # <--- UPDATED TO v1
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YAHAKEEM_B9349 }}'
          projectId: 'yahakeem-b9349'
          channelId: 'pr-${{ github.event.number }}' # Always provide a channelId for PRs
          expires: '7d' # Optional: expire preview channel after 7 days

      # STEP 2: Deploy to Firebase Hosting (Live Channel for Pushes to Main)
      - name: Deploy to Firebase Hosting (Live Channel)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v1 # <--- UPDATED TO v1
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YAHAKEEM_B9349 }}'
          projectId: 'yahakeem-b9349'
          # NOTE: 'channelId' is DELIBERATELY OMITTED here for live deployment.
          # The action defaults to deploying to the live channel if channelId is not specified.
          
