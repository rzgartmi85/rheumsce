name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # Deploys to your live channel when changes are pushed to the main branch
  pull_request:
    branches:
      - main # Creates a preview channel for each pull request

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Node.js (adjust version if needed)
      - uses: actions/setup-node@v4
        with:
          node-version: '20' # Recommended Node.js LTS version

      # Install dependencies and build your project
      # Assuming your project uses npm and has a build script. Adjust if using yarn or a different build command.
      - run: npm ci
      - run: npm run build

      # Deploy to Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}' # Provided by GitHub for PR comments
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_YAHAKEEM_B9349 }}' # Your secret name
          projectId: 'yahakeem-b9349' # Your Firebase Project ID
          # Conditional deployment based on the event that triggered the workflow
          # If it's a pull request, create a preview channel
          # Otherwise, deploy to the default live channel
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || '' }}
          expires: ${{ github.event_name == 'pull_request' && '7d' || '' }} # Optional: expire preview channel after 7 days
